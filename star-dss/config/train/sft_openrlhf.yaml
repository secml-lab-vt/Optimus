# reference model
ref_offload: false

# epoch & batch size
max_epochs: 10
micro_train_batch_size: 4 # batch size per GPU
train_batch_size: 32 # Global training batch size

# gradient
max_norm: 1.0 # Gradient clipping
grad_accum_dtype: null # Adam grad accum data type
gradient_checkpointing: false
gradient_checkpointing_use_reentrant: false

# loss & optimizer
aux_loss_coef: 0 # MoE balancing loss
use_pretrain_loss: false # Use pretrain loss in finetuning
l2: 0 # weight decay loss
adam_betas: [0.9, 0.95] # Betas for Adam optimizer

# learning rate
# options here: https://github.com/huggingface/transformers/blob/main/src/transformers/trainer_utils.py#L418
lr_scheduler: cosine_with_min_lr
lr_warmup_ratio: 0.03
min_learning_rate: 5e-8
learning_rate: 5e-6

# max tokens for training samples
max_len: 2048

# evaluation
eval_steps: -1

# packing SFT samples without CrossAttention
packing_samples: false # combine multiple short sentences in one training sequence

# corner case for ptx loss (backward twice)
# https://github.com/OpenRLHF/OpenRLHF/blob/00ef17c92403add1e269faa6ae12d946546700ba/openrlhf/utils/deepspeed/deepspeed.py#L237
pretrain_data: null

# use value as a defense in harmful finetuning attack
use_value: false
use_kl: false
kl_estimator: null
kl_scale: null

# ======
# unsure this multiturn means multi round conversation or related to packing samples
multiturn: false # Use compacted multiturn dataset
# pretrain: null # openrlhf model name
