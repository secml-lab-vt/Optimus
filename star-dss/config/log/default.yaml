# checkpoint
save_path: final_hf # path to save final model weights
save_steps: 200 # save checkpoint every save_steps
disable_ds_ckpt: false # save ds checkpoint which includes optimizer, scheduler, and training states
save_hf_ckpt: false # save checkpoint in hf format (model+tokenizer) 
ckpt_path: checkpoints
max_ckpt_num: 3
max_ckpt_mem: 1e8
load_checkpoint: false

# logging
logging_steps: 1
use_wandb: true
wandb_org: null
wandb_group: null
wandb_project: llm_poloclub
wandb_run_name: ${..name}
use_tensorboard: false

# inference generation save path
tmp_path: tmp
